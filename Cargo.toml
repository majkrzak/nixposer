[package]
name = "nixposer"
version = "0.0.0"
authors = ["Piotr Majkrzak <piotr@majkrzak.dev>"]
description = "Brings Nix reproducibility into the hostile Composer ecosystem."
repository = "https://github.com/majkrzak/nixposer"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
camino = "1.2.6"
clap = { version = "4", features = ["derive"] }
itertools = "0.15.0"
nix-archive = "0.6.0"
nix-derivation = "0.6.1"
nix-narinfo = "0.4.0"
nom = "8"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-lexpr = "0.1.3"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
typify = "0.8.0"
url = "2.5.8"
zip = "8.6.0"

[lints.clippy]
pedantic = "warn"
missing_errors_doc = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
